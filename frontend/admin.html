<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Casa do Livro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER (Kopie von index.html) -->
    <header class="site-header">
        <div class="top-bar">
            <div class="top-inner">
                <div class="top-links">
                    <a href="index.html">Zurück zum Shop</a>
                    <a href="#" onclick="logout()">Abmelden</a>
                </div>                
            </div>
        </div>

        <div class="header-main" style="display: flex; justify-content: space-between; align-items: center; padding: 20px;">
            <a href="index.html" class="logo">
                <img src="bilder/logo.png" alt="Casa do Livro Logo" style="height: 80px; width: auto;">
            </a>
            <div style="font-size: 24px; color: var(--primary-color); font-weight: 700; font-family: 'Montserrat', sans-serif;">
                Admin-Bereich
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container">
        <h2>Neues Buch anlegen</h2>
        
        <div class="form-box" style="max-width: 900px; margin-top: 20px;">
            <form id="buchForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    
                    <!-- Linke Spalte -->
                    <div>
                        <div class="form-group">
                            <label for="name">Buchtitel *</label>
                            <input type="text" id="name" required>
                        </div>
                        <div class="form-group">
                            <label for="autor">Autor</label>
                            <input type="text" id="autor">
                        </div>
                        <div class="form-group">
                            <label for="isbn">ISBN</label>
                            <input type="text" id="isbn">
                        </div>
                        <div class="form-group">
                            <label for="verlag">Verlag</label>
                            <input type="text" id="verlag">
                        </div>
                    </div>

                    <!-- Rechte Spalte -->
                    <div>
                        <div class="form-group">
                            <label for="erscheinungsjahr">Erscheinungsjahr</label>
                            <input type="number" id="erscheinungsjahr">
                        </div>
                        <div class="form-group">
                            <label for="preis">Preis (€) *</label>
                            <input type="number" step="0.01" id="preis" required>
                        </div>
                        <div class="form-group">
                            <label for="lagerbestand">Lagerbestand *</label>
                            <input type="number" id="lagerbestand" required>
                        </div>
                        <div class="form-group">
                            <label for="bild_url">Bild-URL (z.B. bilder/buch1.jpg)</label>
                            <input type="text" id="bild_url">
                        </div>
                        <div class="form-group">
                            <label for="rabatt_prozent">Rabatt in % (optional)</label>
                            <input type="number" id="rabatt_prozent" min="0" max="100">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="beschreibung">Beschreibung</label>
                    <textarea id="beschreibung" rows="4" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Roboto Condensed';"></textarea>
                </div>

                <div class="form-group">
                    <label for="kategorie">Kategorie *</label>
                    <select id="kategorie" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="">Bitte wählen...</option>
                        <!-- Wird per JS gefüllt -->
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Buch anlegen</button>
            </form>
        </div>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #eee;">

        <h2>Alle Bücher verwalten</h2>
                        
        <!-- NEU: Suchfeld für den Admin-Bereich -->
        <div style="margin: 15px 0;">
            <input type="text" id="adminSuchInput" placeholder="Suche nach Titel, Autor oder ISBN..." 
                   style="width: 100%; max-width: 500px; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; font-family: 'Roboto Condensed';">
        </div>

        <div id="adminProduktListe">
            <!-- Wird per JS gefüllt -->
        </div>
    </main>

    <footer>
        &copy; 2026 Casa do Livro - Alle Rechte vorbehalten
    </footer>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
